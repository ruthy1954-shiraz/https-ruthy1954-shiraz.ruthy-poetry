
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>לגעת / רות שנן</title>

    <!-- אייקון לכרטיסייה -->
    <link rel="icon" type="image/png" sizes="512x512" href="icons/oklagaat-512x512.png">
    <link rel="icon" type="image/png" href="icons/oklagaat-192x192.png">

    <!-- קישור ל־manifest.json -->
    <link rel="manifest" href="manifest.json">

    <!-- עיצוב -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="wrapper">

    <!-- תמונת הדף -->
    <div class="song-image">
        <img src="content/images/shir.jpeg" alt="עטיפת הספר לגעת">
    </div>

    <!-- כותרות -->
    <h1 class="song-title">לגעת</h1>
    <h2 class="song-author">ספר השירה של רות שנן</h2>

    <!-- טקסט הדף -->
    <div class="song-box">
        <p>
            רגע לפני שהמילים נולדות,<br>
            היד נוגעת בדף,<br>
            והלב נפתח.<br><br>
            הזמנה לגעת, להרגיש, להקשיב.
        </p>
    </div>

    <!-- כפתור התקנה למסך הבית -->
    <button id="installAppBtn">📱 התקן את האתר למסך הבית</button>

    <!-- כפתור הערות -->
    <button class="toggle-notes">הערות והארות</button>

    <!-- תיבת הערות -->
    <div class="notes-box hidden">
        <h3>כתיבת הערות והארות</h3>

        <input id="userName" placeholder="השם שלכם..." />
        <input id="userSong" placeholder="שם הדף..." value="דף הבית" />
        <textarea id="userNote" placeholder="כתבו כאן את מחשבותיכם על האתר..."></textarea>

        <div class="footer-nav" style="margin-top:15px;">
            <a id="waLink">ווצאפ לכותבת</a> |
            <a id="saveLink">שמירת הערה</a>
        </div>

        <h4>הערות קוראים שנשמרו:</h4>
        <div id="notes"></div>
    </div>

</div>

<!-- ניווט -->
<div class="footer-nav">
    <a href="content/poets/write-poem.html" class="join-btn">כתיבת שיר חדש</a> |
    <a href="content/poets/poets.html" class="join-btn">בימת המשוררים</a> |
    <a href="content/song.html">שירים</a> |
    <a href="content/tikshurim/tikshurim-list.html">תקשורים</a> |
    <a href="content/about.html">על הספר</a> |
    <a href="content/about-author.html">אודות המחברת</a>
    <a href="help-install.html" class="join-btn" style="color:#4a2c6b; font-weight:bold;">
        🛠️ פתרון בעיות התקנה
    </a>
</div>

<!-- מזהה ייחודי לדף -->
<script>
    var songId = "homepage";
</script>

<!-- מערכת ההערות + ווצאפ -->
<script type="module">
    import { initNoteSystem, saveNoteToFirestore } from "./notes.js";

    initNoteSystem(songId);

    const waLink = document.getElementById("waLink");
    const saveLink = document.getElementById("saveLink");
    const phone = "972545305123";

    waLink.addEventListener("click", () => {
        const name = document.getElementById("userName").value.trim();
        const song = document.getElementById("userSong").value.trim();
        const note = document.getElementById("userNote").value.trim();

        const message = `שם הכותב: ${name}\nדף: ${song}\nהערה: ${note}`;
        const encoded = encodeURIComponent(message);
        window.open(`https://wa.me/${phone}?text=${encoded}`, "_blank");
    });

    saveLink.addEventListener("click", () => {
        const name = document.getElementById("userName").value.trim();
        const song = document.getElementById("userSong").value.trim();
        const note = document.getElementById("userNote").value.trim();

        saveNoteToFirestore(name, song, note, songId);
    });
</script>

<!-- פתיחה/סגירה של תיבת הערות -->
<script>
document.addEventListener("DOMContentLoaded", () => {
    const toggleBtn = document.querySelector(".toggle-notes");
    const notesBox = document.querySelector(".notes-box");

    if (!toggleBtn || !notesBox) return;

    toggleBtn.addEventListener("click", () => {
        notesBox.classList.toggle("hidden");

        toggleBtn.textContent = notesBox.classList.contains("hidden")
            ? "הערות והארות"
            : "הסתרת הערות";
    });
});
</script>

<!-- התקנה למסך הבית -->
<script>
let deferredPrompt;

window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById("installAppBtn").style.display = "block";
});

document.getElementById("installAppBtn").addEventListener("click", async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  console.log(`User response: ${outcome}`);
  deferredPrompt = null;
});
</script>

<!-- רישום ה־Service Worker -->
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js')
    .then(() => console.log("Service Worker registered"))
    .catch(err => console.log("SW registration failed", err));
}
</script>

<!-- עיצוב כפתור התקנה -->
<style>
#installAppBtn {
    display: none;
    margin: 20px auto;
    padding: 12px 20px;
    background-color: #d3b8ff;
    color: #4a2c6b;
    border: none;
    border-radius: 8px;
    font-size: 18px;
    cursor: pointer;
}
</style>

</body>
</html>
